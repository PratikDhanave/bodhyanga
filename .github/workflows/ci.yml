name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: build · vet · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test (race, whole module)
        run: go test -race ./...

      # Coverage is gated on library code (./pkg/...), not on cmd/* entrypoints.
      # main() functions bind sockets, call os.Exit and parse flags — they are
      # exercised by the smoke jobs below (demo, bench, integration), not by unit
      # coverage. Gating the whole module is unachievable by construction and hid
      # a red gate; gating pkg/ measures the code that unit tests actually own.
      - name: go test (coverage, pkg/)
        run: go test -coverprofile=coverage.out ./pkg/...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -20

      - name: coverage gate (pkg/, fail below 85%)
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}' | tr -d '%')
          echo "pkg/ coverage: ${TOTAL}%"
          if [ "$(echo "$TOTAL < 85" | bc -l)" = "1" ]; then
            echo "::error::pkg/ coverage ${TOTAL}% is below 85% threshold"
            exit 1
          fi

      - name: go test (otel build tag)
        run: go test -tags otel ./pkg/observability/... -v 2>&1 | tail -10

      - name: go vet (otel build tag)
        run: go vet -tags otel ./pkg/observability/...

      - name: smoke — diagnostic demo
        run: go run ./cmd/demo | tail -5

      - name: smoke — bench
        run: go run ./cmd/bench -timeout=5s | tail -10

      - name: smoke — integration (full MARA pipeline)
        run: go test -run TestIntegration ./pkg/orchestration/... -v -timeout=30s 2>&1 | tail -10

  maf:
    name: maf · build · vet · test
    runs-on: ubuntu-latest
    # Nested module (github.com/PratikDhanave/bodh-maf) — the parent module's
    # `go build ./...` does not descend into maf/, so it is built and tested here
    # as its own unit. It uses `replace github.com/PratikDhanave/bodh => ..`, so
    # the checkout of this repo supplies the parent source. Requires Go 1.26.
    defaults:
      run:
        working-directory: maf
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: maf/go.sum

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # pkg/ckptpg uses testcontainers (Docker + Postgres); Docker is preinstalled
      # on ubuntu-latest (see the `docker` job), so those tests run natively. If a
      # container cannot start the ckptpg tests skip themselves rather than fail.
      - name: go test
        run: go test -race ./...

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...

  frontend:
    name: frontend · build · test
    runs-on: ubuntu-latest
    # The clinician SPA is go:embed'd into cmd/care and committed under
    # cmd/care/web/dist/. It was never gated here, so src/ could stop compiling
    # while a stale dist/ kept serving — this job closes that gap.
    defaults:
      run:
        working-directory: cmd/care/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cmd/care/web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: typecheck + build
        run: npm run build
      - name: unit tests
        run: npm run test

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t bodh/care:ci -f Dockerfile .
