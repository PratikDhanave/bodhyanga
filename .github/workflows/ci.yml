name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: build · vet · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -20

      - name: coverage gate (fail below 80%)
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${TOTAL}%"
          if [ "$(echo "$TOTAL < 80" | bc -l)" = "1" ]; then
            echo "::error::Coverage ${TOTAL}% is below 80% threshold"
            exit 1
          fi

      - name: go test (otel build tag)
        run: go test -tags otel ./pkg/observability/... -v 2>&1 | tail -10

      - name: go vet (otel build tag)
        run: go vet -tags otel ./pkg/observability/...

      - name: smoke — diagnostic demo
        run: go run ./cmd/demo | tail -5

      - name: smoke — bench
        run: go run ./cmd/bench -timeout=5s | tail -10

      - name: smoke — integration (full MARA pipeline)
        run: go test -run TestIntegration ./pkg/orchestration/... -v -timeout=30s 2>&1 | tail -10

  maf:
    name: maf · build · vet · test
    runs-on: ubuntu-latest
    # Nested module (github.com/PratikDhanave/bodh-maf) — the parent module's
    # `go build ./...` does not descend into maf/, so it is built and tested here
    # as its own unit. It uses `replace github.com/PratikDhanave/bodh => ..`, so
    # the checkout of this repo supplies the parent source. Requires Go 1.26.
    defaults:
      run:
        working-directory: maf
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: maf/go.sum

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # pkg/ckptpg uses testcontainers (Docker + Postgres); Docker is preinstalled
      # on ubuntu-latest (see the `docker` job), so those tests run natively. If a
      # container cannot start the ckptpg tests skip themselves rather than fail.
      - name: go test
        run: go test -race ./...

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t bodh/care:ci -f Dockerfile .
