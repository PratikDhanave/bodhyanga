# staticcheck configuration — https://staticcheck.dev/docs/configuration/
#
# U1000 (unused code) is disabled repo-wide. Bodh deliberately carries
# built-but-unwired substrate that a decoupled or clinical profile wires later:
#   - cmd/care/auth_handler.go  (JWT auth middleware — not yet mounted; ADR-0006)
#   - cmd/care/bulk_handler.go  (FHIR bulk export — not yet mounted)
#   - pkg/gateway, pkg/graduation (admission + autonomy substrate; ADR-0007/0012)
# Flagging these as "unused" is a false positive against that design, so U1000
# is off. "inherit" keeps staticcheck's curated DEFAULT set (all SAxxxx bug and
# Sxxxx simplification checks; the noisy ST10xx style checks stay off as they are
# by default) — we only subtract U1000. This config was added after staticcheck
# caught a real ignored strings.HasPrefix and tautological test assertions.
checks = ["inherit", "-U1000"]
