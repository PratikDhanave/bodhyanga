# Adapted from https://github.com/ardanlabs/service/blob/master/zarf/compose/docker_compose.yaml
# Original copyright Ardan Labs (Apache 2.0). Modifications for Bodhyanga.
#
# Local-dev stack. `docker compose up` launches:
#   - postgres       — durable Bodhyanga DB (RLS-bound bodhyanga_app role)
#   - bodhyanga-care      — HTTP API (cmd/care) on :8088
#   - bodhyanga-ollama    — local LLM provider for llm-ollama
#   - prometheus     — metrics scrape
#   - grafana        — dashboards (admin/admin out of the box)
#   - tempo          — distributed tracing backend for OTLP exports
#   - loki           — logs aggregation
#   - bodhyanga-kronk     — optional admin tool, commented out by default
#                      (needs `-tags=kronk`; uncomment after the binary lands)
services:
  postgres:
    # Pinned minor — never use :latest. Bump deliberately.
    image: postgres:16.4-alpine
    container_name: bodhyanga-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bodhyanga
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d bodhyanga"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      bodhyanga-net:
        ipv4_address: 10.6.0.2

  bodhyanga-ollama:
    # ollama/ollama publishes per-version tags. Pin to a known minor.
    image: ollama/ollama:0.5.4
    container_name: bodhyanga-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      # Ollama exposes /api/tags as a cheap liveness check.
      test: ["CMD-SHELL", "wget -qO- http://localhost:11434/api/tags >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      bodhyanga-net:
        ipv4_address: 10.6.0.3

  bodhyanga-care:
    # Built from zarf/docker/Dockerfile.care. The tag matches `make docker`.
    image: localhost/bodhyanga-care:dev
    pull_policy: never
    build:
      context: ../..
      dockerfile: zarf/docker/Dockerfile.care
    container_name: bodhyanga-care
    ports:
      - "8088:8088"
    environment:
      BODHYANGA_LISTEN_ADDR: ":8088"
      BODHYANGA_DB_DSN: "postgres://postgres:postgres@postgres:5432/bodhyanga?sslmode=disable"
      BODHYANGA_TENANT_ID: "compose-dev"
      BODHYANGA_DIAGNOSTICIAN: "llm-ollama"
      OLLAMA_HOST: "http://bodhyanga-ollama:11434"
      BODHYANGA_KNOWLEDGE_CORPUS: "/data/knowledge/corpus.json"
      BODHYANGA_AUDIT_SINK: "/var/lib/bodhyanga/audit.log"
      BODHYANGA_LOG_LEVEL: "debug"
    volumes:
      - audit-data:/var/lib/bodhyanga
    healthcheck:
      # /healthz is the cmd/care liveness endpoint registered in
      # cmd/care/health.go — always 200 while the process is running.
      # /readyz also pings Postgres; the compose probe uses /healthz (lighter).
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      bodhyanga-ollama:
        condition: service_started
    networks:
      bodhyanga-net:
        ipv4_address: 10.6.0.10

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: bodhyanga-prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      bodhyanga-care:
        condition: service_healthy
    restart: unless-stopped
    networks:
      bodhyanga-net:
        ipv4_address: 10.6.0.20

  grafana:
    image: grafana/grafana:11.3.0
    container_name: bodhyanga-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      bodhyanga-net:
        ipv4_address: 10.6.0.21

  tempo:
    image: grafana/tempo:2.6.1
    container_name: bodhyanga-tempo
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "3200:3200" # tempo HTTP
    command: ["-config.file=/etc/tempo.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      bodhyanga-net:
        ipv4_address: 10.6.0.22

  loki:
    image: grafana/loki:3.2.1
    container_name: bodhyanga-loki
    ports:
      - "3100:3100"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      bodhyanga-net:
        ipv4_address: 10.6.0.23

  # ----------------------------------------------------------------------
  # OPTIONAL — bodhyanga-kronk admin tool. Uncomment after the binary ships and
  # the Dockerfile.bodhyangaadmin build context is wired into CI. The image must
  # be built with `-tags=kronk` (see zarf/docker/Dockerfile.bodhyangaadmin).
  # ----------------------------------------------------------------------
  # bodhyanga-kronk:
  #   image: localhost/bodhyanga-kronk:dev
  #   pull_policy: never
  #   build:
  #     context: ../..
  #     dockerfile: zarf/docker/Dockerfile.bodhyangaadmin
  #   container_name: bodhyanga-kronk
  #   environment:
  #     BODHYANGA_API: "http://bodhyanga-care:8088"
  #   depends_on:
  #     bodhyanga-care:
  #       condition: service_healthy
  #   networks:
  #     bodhyanga-net:
  #       ipv4_address: 10.6.0.30

volumes:
  postgres-data: {}
  ollama-data: {}
  audit-data: {}

networks:
  bodhyanga-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.6.0.0/24
