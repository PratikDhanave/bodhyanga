# Adapted from https://github.com/ardanlabs/service/blob/master/zarf/compose/pg_hba.conf
# Original copyright Ardan Labs (Apache 2.0). Modifications for Bodh.
#
# pg_hba.conf — dev / compose cluster only. NOT for production.
#
# Production Postgres deployments use IAM authentication (Cloud SQL IAM,
# RDS IAM, Azure AD) and the cluster-issued client certificate trust chain
# — never password trust. The bodh prod overlay terminates the TLS at the
# Cloud SQL Auth Proxy sidecar, which the application reaches via localhost,
# so pg_hba on the upstream Cloud SQL instance enforces cert-only auth.
#
# This file is the loose dev pattern Ardan Labs ships — fine for `docker
# compose up` on a developer's laptop, fine for kind clusters, NEVER fine
# for an internet-reachable Postgres.
#
# Columns: TYPE  DATABASE        USER            ADDRESS                 METHOD

# Unix-socket local connections inside the container.
local   all             all                                             trust

# IPv4 — accept connections from the docker-compose subnet (10.6.0.0/24)
# and from the host bridge (127.0.0.1 / 172.16.0.0/12).
host    all             all             10.6.0.0/24                     scram-sha-256
host    all             all             127.0.0.1/32                    scram-sha-256
host    all             all             172.16.0.0/12                   scram-sha-256

# IPv6 — loopback only.
host    all             all             ::1/128                         scram-sha-256

# Replication channels — loopback only (no replication in compose, but
# leaving the slots reserved makes it obvious how to extend).
local   replication     all                                             trust
host    replication     all             127.0.0.1/32                    scram-sha-256
host    replication     all             ::1/128                         scram-sha-256
