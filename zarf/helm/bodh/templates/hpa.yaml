{{- if .Values.autoscaling.enabled -}}
# HorizontalPodAutoscaler for the Bodh care deployment.
#
# When autoscaling is enabled, replicas is removed from the Deployment spec
# so HPA owns the replica count. The HPA will scale between minReplicas and
# maxReplicas based on CPU utilization (and optionally memory).
#
# Note: HPA requires the metrics-server to be installed in the cluster.
# Install it with: kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "bodh.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bodh.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "bodh.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
