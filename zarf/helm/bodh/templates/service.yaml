# ClusterIP Service for the Bodh care HTTP API.
# External exposure happens at the Ingress / Gateway layer — never via
# NodePort or LoadBalancer here, so accidental public exposure is
# impossible without an explicit values change.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bodh.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bodh.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "bodh.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
