{{- if .Values.podDisruptionBudget.enabled -}}
# PodDisruptionBudget — keep at least minAvailable Bodhyanga care Pods available
# during voluntary disruptions (node drains, autoscaler scaledown, rolling
# updates). This is important for HITL reviews that may sit in the queue
# across a drain window.
#
# With 2 replicas and minAvailable=1: one voluntary disruption at a time
# is tolerated without losing serving capacity.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "bodhyanga.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bodhyanga.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "bodhyanga.selectorLabels" . | nindent 6 }}
  unhealthyPodEvictionPolicy: AlwaysAllow
{{- end }}
