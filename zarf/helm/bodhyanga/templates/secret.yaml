{{- if not .Values.existingSecret -}}
# Opaque Secret for sensitive environment variables (dev/CI mode).
#
# PRODUCTION USAGE:
#   Set existingSecret to the name of a pre-created Kubernetes Secret
#   (e.g., managed by External Secrets Operator, Vault Agent, or GKE
#   Secret Manager CSI driver). When existingSecret is set, this
#   chart-managed Secret is NOT rendered, and the Deployment references
#   the named external secret instead.
#
# DEV/CI USAGE:
#   Populate values.env with base64-safe plaintext values and Helm will
#   base64-encode them into this Secret. NEVER commit real keys.
#   Use a values override file (values.dev.yaml) with --values flag.
#
# Variables managed here:
#   BODHYANGA_DB_DSN          — PostgreSQL connection string
#   ANTHROPIC_API_KEY    — Anthropic API key (llm-anthropic diagnostician)
#   OPENAI_API_KEY       — OpenAI API key   (llm-openai diagnostician)
#   LMNR_PROJECT_API_KEY — Laminar tracing API key
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bodhyanga.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bodhyanga.labels" . | nindent 4 }}
  annotations:
    # Helm manages this secret — rotate values via helm upgrade, not kubectl patch.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $key, $val := .Values.env }}
  {{- if $val }}
  {{ $key }}: {{ $val | quote }}
  {{- else }}
  {{ $key }}: ""
  {{- end }}
  {{- end }}
{{- end }}
