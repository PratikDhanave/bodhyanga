{{- if .Values.serviceAccount.create -}}
# ServiceAccount for the Bodhyanga care workload.
# The annotation seam supports GKE Workload Identity binding:
#   serviceAccount.annotations:
#     iam.gke.io/gcp-service-account: "bodhyanga-care@PROJECT.iam.gserviceaccount.com"
# Token automount is disabled — the workload uses Workload Identity
# (TokenRequest projected volume), not the legacy SA token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bodhyanga.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bodhyanga.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
