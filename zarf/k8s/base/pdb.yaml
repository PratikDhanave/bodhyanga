#
# Pod Disruption Budget — keep at least one Bodhyanga care Pod available during
# voluntary disruptions (node drains, autoscaler scaledown, rolling updates).
# This matters for HITL reviews that may sit in the queue across the drain
# window. See docs/governance.md § HITL gate and the GKE field map
# (bodhyanga-linkedin/09-gke-ai-infra-medical-multiagent.md § Pod Disruption Budgets).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bodhyanga-care
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bodhyanga-care
  unhealthyPodEvictionPolicy: AlwaysAllow
