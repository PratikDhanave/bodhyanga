#
# ClusterIP Service for the Bodhyanga care HTTP API. External exposure happens
# at the Ingress / Gateway layer in the overlays — never via NodePort or
# LoadBalancer at base, so accidental public exposure is impossible without
# an explicit overlay change.
apiVersion: v1
kind: Service
metadata:
  name: bodhyanga-care
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bodhyanga-care
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
