# ServiceAccount for the Bodhyanga care workload. The annotation placeholder is
# the GKE Workload Identity binding seam — bodhyanga-linkedin/09-gke-ai-infra-medical-multiagent.md
# describes the topology: K8s SA → Google SA → Cloud SQL IAM role per tenant.
# Replace PROJECT_ID and GSA_NAME in the prod overlay before applying.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bodhyanga-care
  annotations:
    # Workload Identity binding placeholder. Overlays patch the real value.
    # See: https://cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
    iam.gke.io/gcp-service-account: "REPLACE-bodhyanga-care@REPLACE-PROJECT.iam.gserviceaccount.com"
# Token automount is disabled — the workload talks to GCP via Workload Identity
# (TokenRequest projected volume), not the legacy SA token, so no Pod-level
# token volume is needed for the application path.
automountServiceAccountToken: false
