#
# Production ConfigMap patch — Anthropic as the default LLM provider, OTel
# export enabled (image must be built with -tags otel), info-level logs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bodh-care-config
data:
  BODH_LOG_LEVEL: "info"
  BODH_DIAGNOSTICIAN: "llm-anthropic"
  BODH_OTEL_EXPORT: "1"
  BODH_OTEL_ENDPOINT: "http://otel-collector.observability:4318"
