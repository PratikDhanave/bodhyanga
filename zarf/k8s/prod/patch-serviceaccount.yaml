# Adapted from the ardanlabs/service zarf layout — placeholder Workload
# Identity binding pinned to a concrete Google Service Account name.
# Original copyright Ardan Labs (Apache 2.0). Modifications for Bodhyanga.
#
# Replace PROJECT and GSA in this patch (or via a kustomize replacement
# transformer in CI) before applying. Until those are real, the Pod will
# fail to fetch a GCP token and the Cloud SQL Auth Proxy sidecar will
# fail readiness — surfacing the misconfiguration loudly.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bodhyanga-care
  annotations:
    iam.gke.io/gcp-service-account: "bodhyanga-care@REPLACE-PROJECT.iam.gserviceaccount.com"
